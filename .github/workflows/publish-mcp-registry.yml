# Publishes server.json to the Official MCP Registry as io.github.deepa-wagent/wagent.
# GitHub OIDC proves the namespace, so no login or secret is stored. Bump "version" in server.json, then run this.
name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher v1.8.8
        run: curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
