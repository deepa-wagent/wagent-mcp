# Publishes server.json to the Official MCP Registry as io.github.deepa-wagent/wagent.
# GitHub OIDC proves the namespace, so no login or secret is stored. Bump "version" in server.json, then run this.
name: Publish to MCP Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Built from the tagged source with Go: release-asset downloads returned 504 on 2026-11-08.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Build mcp-publisher v1.8.8
        run: GOBIN="$PWD" go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.8 && mv publisher mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
